name: Deploy to VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

# Never let two deploys touch the box at once, and never cancel one midway
# through a docker build.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # The key is pinned to a forced command on the server, so the command
      # sent here is ignored — the box always runs /root/deploy-apna.sh, which
      # resets to origin/master and rebuilds the container.
      # Retried because the runner-to-Hostinger hop times out occasionally with
      # no fault on the server side (no firewall, no fail2ban, box reachable
      # throughout). The deploy script is idempotent, so a repeat is harmless.
      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          for attempt in 1 2 3; do
            if ssh -i ~/.ssh/deploy_key \
                   -o IdentitiesOnly=yes \
                   -o BatchMode=yes \
                   -o ConnectTimeout=25 \
                   "$DEPLOY_USER@$DEPLOY_HOST" deploy; then
              exit 0
            fi
            echo "Deploy attempt $attempt failed"
            [ "$attempt" -lt 3 ] && sleep 15
          done
          echo "Deploy failed after 3 attempts"
          exit 1

      # Checks the hostnames that actually resolve to this VPS. Do NOT point
      # this at apnadigitalzone.com — that domain still resolves to the
      # client's old hosting (132.148.183.62), so it returns 200 regardless of
      # whether this deploy succeeded.
      - name: Verify deployed site responds
        run: |
          check() {
            host="$1"
            min_bytes="$2"
            for attempt in 1 2 3 4 5; do
              read -r code size <<<"$(curl -sS -o /dev/null \
                -w '%{http_code} %{size_download}' --max-time 20 "$host" || echo '000 0')"
              if [ "$code" = "200" ] && [ "$size" -ge "$min_bytes" ]; then
                echo "OK  $host -> $code, ${size} bytes"
                return 0
              fi
              echo "Attempt $attempt: $host -> $code, ${size} bytes; retrying in 10s"
              sleep 10
            done
            echo "FAIL $host did not serve a valid response after deploy"
            return 1
          }

          check https://apnadigital.ai-workflows.cloud/ 50000
          check https://apnadigitalapp.ai-workflows.cloud/ 30000
